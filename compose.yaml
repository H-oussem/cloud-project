# ContainerLab - Multi-Tier Docker Compose Specification
# Orchestrates Frontend (React+Nginx), API (Node/Express), and Database (PostgreSQL)
# Implements dual-network segmentation and dependency health checks

services:
  # Tier 3: Stateful Relational Database
  postgres:
    build:
      context: ./application/database
      dockerfile: Dockerfile
    image: containerlab-database:v1.0.0
    container_name: containerlab-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-containerlab_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres123}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-containerlab_db}"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  # Tier 2: Stateless REST API
  api:
    build:
      context: ./application/backend
      dockerfile: Dockerfile
    image: containerlab-api:v1.0.0
    container_name: containerlab-api
    restart: unless-stopped
    environment:
      PORT: 5000
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-containerlab_db}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres123}
    networks:
      - frontend-net
      - backend-net
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5000/api/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 3s

  # Tier 1: Static Web Server & Reverse Proxy
  frontend:
    build:
      context: ./application/frontend
      dockerfile: Dockerfile
    image: containerlab-frontend:v1.0.0
    container_name: containerlab-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    networks:
      - frontend-net
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80/healthz"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 3s

# Network Segmentation:
# - frontend-net: connects frontend <-> api
# - backend-net: connects api <-> postgres
# - postgres is isolated and unreachable directly from frontend
networks:
  frontend-net:
    driver: bridge
  backend-net:
    driver: bridge

# Persistent Data Storage for PostgreSQL
volumes:
  postgres_data:
    driver: local
