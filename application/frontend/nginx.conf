server {
    listen 80;
    server_name localhost;

    # Root directory containing React production static build
    root /usr/share/nginx/html;
    index index.html index.htm;

    # Gzip compression for optimized bundle delivery
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Single Page Application routing - fallback to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy for Backend API
    # Resolves internal service name 'api' on port 5000 in both Docker Compose and Kubernetes
    location /api/ {
        proxy_pass http://api:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }

    # Custom health check endpoint for Nginx container
    location = /healthz {
        access_log off;
        return 200 "healthy\n";
    }

    # Error handling
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
